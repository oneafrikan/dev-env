# ─────────────────────────────────────────────
# ~/.tmux.conf — symlinked from ~/.dev-env/tmux/.tmux.conf
# ─────────────────────────────────────────────

# ── Prefix ────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── Core settings ─────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0                    # zero escape delay — critical for Vim/Cursor
set -g history-limit 50000
set -g display-time 4000
set -g focus-events on

# ── 256 colour + true colour ──────────────────
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ── Splits ────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Pane navigation (Alt+arrow, no prefix) ────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Window navigation (Shift+arrow) ───────────
bind -n S-Left  previous-window
bind -n S-Right next-window

# ── Reload config ─────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Copy mode ─────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# ── Status bar ────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-left-length 40
set -g status-right-length 60

# Colours
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
setw -g window-status-style "fg=#6c7086"
setw -g window-status-current-style "fg=#cba6f7,bold"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"

# Left: session name
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#6c7086]│ "

# Centre: window list
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#cba6f7,bold] #I:#W* "

# Right: date/time
set -g status-right "#[fg=#6c7086]%Y-%m-%d #[fg=#89b4fa]%H:%M "

# ── TPM + plugins ─────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect / continuum settings
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM — must be last line
run '~/.tmux/plugins/tpm/tpm'
